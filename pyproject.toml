[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tex2docx-converter"
version = "0.1.3"
description = "Convert LaTeX documents to Word (.docx) preserving TikZ diagrams, cover page, table of contents, acronyms, and bibliography."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  {name = "Santos", email = "santoscaveroperez@gmail.com"} 
]
keywords = ["latex", "docx", "word", "pandoc", "tikz", "pdf", "converter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = [
  "PyMuPDF>=1.23.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
tex2docx = "tex2docx:main"
