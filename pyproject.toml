[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tex2docx-converter"
version = "0.1.0"
description = "Convert LaTeX documents to Word (.docx) preserving TikZ diagrams, cover page, table of contents, acronyms, and bibliography."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  {name = "Santos", email = "santoscaveroperez@gmail.com"} 
]
dependencies = [
  "PyMuPDF>=1.23.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
tex2docx = "tex2docx:main"
